<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <main>
        <div class="container" id="container">
            <div class="change--box" id="change--box">
                <h1 class="text--change" id="text--change">Interactive Background Color Changer</h1>
                <div class="button---box" id="button--box">
                    <button class="purple--color btn--color" id="purple--color">purple</button>
                    <button class="blue--color btn--color" id="blue--color">blue</button>
                    <button class="red--color btn--color" id="red--color">red</button>
                    <button class="green--color btn--color" id="green--color">green</button>
                    <button class="yellow--color btn--color " id="yellow--color">yellow</button>
                    <button class="teal--color btn--color " id="teal--color">teal</button>
                    <button class="random btn--color " id="random">random</button>
                </div>
            </div>
        </div>
    </main>
    <script src="index.js"></script>
</body>
</html>
